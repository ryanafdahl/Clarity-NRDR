name: Clarity PTC regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  eps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pycapnp==2.1.0 pycryptodome tqdm pytest cffi ruff
      - name: Honda interface, PTC PID, CAN and native safety regression
        env:
          PYTHONPATH: opendbc_repo:.
        run: |
          python -m pytest -q -o addopts= openpilot/sunnypilot/ptc/tests opendbc_repo/opendbc/sunnypilot/car/honda/test_honda.py opendbc_repo/opendbc/car/honda/tests/test_honda.py opendbc_repo/opendbc/safety/tests/test_honda.py
      - name: Check PTC implementation
        run: ruff check openpilot/sunnypilot/ptc openpilot/selfdrive/ui/sunnypilot/layouts/settings/vehicle/brands/honda.py opendbc_repo/opendbc/sunnypilot/car/honda/ptc.py
